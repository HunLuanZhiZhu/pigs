[workspace]
members = [
    "crates/pigs-protocol",
    "crates/pigs-orchestrator",
    "crates/pigs-proxy",
    "crates/pigs",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
bytes = "1"
futures-util = "0.3"
pigs-orchestrator = { path = "crates/pigs-orchestrator" }
pigs-protocol = { path = "crates/pigs-protocol" }
pigs-proxy = { path = "crates/pigs-proxy" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v7"] }
