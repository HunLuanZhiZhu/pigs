# pigs 配置 —— 只有部署位置需要配置（提示词、-pig 规则、相位全部在代码里）
listen = "127.0.0.1:3927"
# 留空 = 透传客户端的 key；填了则覆盖
key = ""

# 三个协议各一个上游地址：base + 客户端原样路径 = 上游 URL。
# chat / responses 的路径不带 /v1（版本段属于 base）；
# anthropic 的路径自带 /v1/messages（版本段属于协议，base 不带）。
[upstream]
openai    = "https://opencode.ai/zen/go/v1"   # 接 /chat/completions
responses = "https://opencode.ai/zen/go/v1"   # 接 /responses
anthropic = "https://opencode.ai/zen/go"      # 接 /v1/messages
